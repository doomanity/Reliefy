name: Build Reliefy APK

# Every push to main builds a signed APK and publishes it as a GitHub release,
# so the app can be downloaded straight from the Releases page on a phone.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'asset/**'
      - 'changelogs/**'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Read app version
        id: version
        run: |
          name=$(grep -E '^version-name' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Reliefy version: $name"

      - name: Generate library licences list
        run: ./gradlew exportLibraryDefinitions --no-configuration-cache

      - name: Build release APKs (FOSS)
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Sign APKs
        id: sign
        env:
          # The key file is in the repo (.github/signing), encrypted. Only its password is secret.
          KEYSTORE_PASSWORD: ${{ secrets.RELIEFY_KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -z "${KEYSTORE_PASSWORD}" ]; then
            echo "::warning::RELIEFY_KEYSTORE_PASSWORD secret is not set, so the APKs are left unsigned and no release is published."
            cp androidApp/build/outputs/apk/release/*-unsigned.apk dist/
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in androidApp/build/outputs/apk/release/*-unsigned.apk; do
            base=$(basename "$apk" -release-unsigned.apk)   # e.g. androidApp-arm64-v8a
            abi=${base#androidApp-}
            out="dist/Reliefy-${VERSION}-${abi}.apk"
            "$BT/zipalign" -p -f 4 "$apk" aligned.apk
            "$BT/apksigner" sign --ks .github/signing/reliefy-release.p12 --ks-key-alias reliefy \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out "$out" aligned.apk
            "$BT/apksigner" verify "$out"
            rm -f aligned.apk
          done
          rm -f dist/*.idsig
          echo "signed=true" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload APKs as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reliefy-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          cat > notes.md <<EOF
          **Which file do I download?**
          - Most phones: \`Reliefy-${VERSION}-arm64-v8a.apk\`
          - Not sure? \`Reliefy-${VERSION}-universal.apk\` works on every phone (bigger file)

          Built from commit ${GITHUB_SHA::7}.

          Reliefy is a fork of [SimpMusic](https://github.com/maxrave-dev/SimpMusic) by maxrave-dev, licensed GPL-3.0.
          EOF
          # Same version gets rebuilt while we iterate: replace the old release instead of failing.
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" \
            --title "Reliefy ${VERSION}" --notes-file notes.md --latest
